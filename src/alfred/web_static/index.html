// Design vor dem ersten Zeichnen setzen, sonst blitzt die Seite kurz im falschen Design auf.
(function () {
  var pref = "dark";
  try { pref = localStorage.getItem("design") || "dark"; } catch (e) {}
  var dunkel = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dunkel ? "dark" : "light";
  document.getElementById("meta-theme").content = dunkel ? "#07080d" : "#f2f3f8";
})();
</script>
