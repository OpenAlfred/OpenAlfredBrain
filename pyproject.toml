[project]
name = "alfred"
version = "0.1.0"
description = "Alfred: sprachgesteuerter persönlicher Agent auf Basis von Pipecat und Mistral"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pipecat-ai[mistral,silero,webrtc,runner]>=1.12,<2",
    "pyyaml>=6",
    "python-dotenv>=1",
    "google-api-python-client>=2",
    "google-auth-oauthlib>=1",
]

[project.optional-dependencies]
# Raum-Modus: Mikrofon und Lautsprecher direkt am Rechner, lokales Wachwort.
# Unter Linux vorher: sudo apt install portaudio19-dev python3-dev build-essential
raum = ["pipecat-ai[local]>=1.12,<2", "vosk>=0.3.45", "hidapi>=0.14"]
# Spotify-Steuerung (braucht Premium und eine eigene App bei developer.spotify.com).
musik = ["spotipy>=2.24"]
dev = ["pytest>=8", "pyflakes>=3"]

[project.urls]
Homepage = "https://github.com/OpenAlfred/alfred"
Issues = "https://github.com/OpenAlfred/alfred/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alfred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
